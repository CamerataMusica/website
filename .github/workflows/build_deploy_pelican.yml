name: Build Pelican site and deploy to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
jobs:
  deploy:
    uses: "getpelican/pelican/.github/workflows/github_pages.yml@3d3265b74c54338b8e9371c51eba4e8ef8b629c9"
    permissions:
      contents: "read"
      pages: "write"
      id-token: "write"
    with:
      settings: "publishconf.py"
      requirements: "-r requirements.txt"
      python: "3.12"
      siteurl: "https://cameratamusica.com"
      deploy: true
      stork: false
      
